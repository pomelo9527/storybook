name: Build IPA

on:
  workflow_dispatch:

jobs:

  build-ios:

    runs-on: macos-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2

        with:
          flutter-version: '3.22.0'

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Install Pods
        run: |
          cd ios
          pod install

      - name: Build iOS
        run: |
          flutter build ios --release --no-codesign
